name: Create Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            exe_path: build/indigo
            artifact_name: indigo-linux

          - os: windows-latest
            name: windows
            exe_path: build/Release/indigo.exe
            artifact_name: indigo-windows.exe

          - os: macos-latest
            name: macos
            exe_path: build/indigo
            artifact_name: indigo-macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure project
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build project
        run: cmake --build build --config Release

      - name: Package binary
        shell: bash
        run: |
          mkdir -p package
          if [ -f "${{ matrix.exe_path }}" ]; then
            cp ${{ matrix.exe_path }} package/${{ matrix.artifact_name }}
          elif [ -f "build/indigo.exe" ]; then
            cp build/indigo.exe package/${{ matrix.artifact_name }}
          elif [ -f "build/indigo" ]; then
            cp build/indigo package/${{ matrix.artifact_name }}
          else
            echo "Binary not found!"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: indigo-${{ matrix.name }}
          path: package/

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Configure and Build WebAssembly
        run: |
          mkdir -p build-wasm
          cd build-wasm
          emcmake cmake .. -DCMAKE_BUILD_TYPE=Release
          emmake make

      - name: Package WebAssembly
        run: |
          mkdir -p package-wasm
          cp build-wasm/indigo.js package-wasm/ 2>/dev/null || true
          cp build-wasm/indigo.wasm package-wasm/ 2>/dev/null || true

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: indigo-wasm
          path: package-wasm/

  release:
    needs: [build, build-wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ProtoIndigo 2.0.0
          body: |
            # ProtoIndigo 2.0.0

            Welcome to ProtoIndigo 2!

            ProtoIndigo is now getting closer to becoming a usable programming language. Now, you can perform mathematical operations, variable reassignments, and take advantage of the maximum performance of the new BreVM virtual machine.

            ## What's new

            - Added Virtual Machine (BreVM)
            - Added Bytecode Compilation
            - Removed the classic interpreter
            - Added new expression Nodes
            - Added variable reassignment
            - Added Mathematical Expressions
            - Removed the requirement of using `;` at the end of every line
            - Added a new syntax for creating constants: `now a = 10`, which does not replace `new const a = 10`, but provides a less verbose alternative
            - Added new keyword `now`
            - Added new string delimiters: `"HelloWorld!"`, `` `HelloWorld!` ``, `'HelloWorld!'`
            - Reorganized internal structure
            - Redesigned Tokenizer
            - Redesigned Parser
            - Added new internal utilities for development
            - Added CLI command: `indigo compile <file>`
            - Added CLI command: `indigo platform`
            - Added CLI command: `indigo --tokenize <file>`
            - Added CLI command: `indigo --parse <file>`
            - Unexpected tokens are now prohibited
            - Added new Nodes and expressions
            - Added Runtime Operation - A class responsible for managing all interpreter components
            - Several internal optimizations to improve execution speed
            - Initial Embedding - ProtoIndigo is beginning to become embeddable into C++ applications
            - Exclusive build tool for the interpreter currently under development
            - Automatic `.bre` file detection, allowing execution without specifying the extension. Example: `indigo run tests/scripts/noextension` executes `noextension.bre`.

            ## Downloads

            Available builds:

            - Windows x64 (`indigo-windows.exe`)
            - Linux x64 (`indigo-linux`)
            - macOS x64 (`indigo-macos`)
            - WebAssembly (`indigo.wasm` / `indigo.js`)
          files: |
            indigo-linux/*
            indigo-windows/*
            indigo-macos/*
            indigo-wasm/*