
name: Create Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            exe_path: build/indigo
            binary_name: indigo
            package_name: ProtoIndigo-2.1.0-beta-linux-x64

          - os: windows-latest
            name: windows
            exe_path: build/Release/indigo.exe
            binary_name: indigo.exe
            package_name: ProtoIndigo-2.1.0-beta-windows-x64

          - os: macos-latest
            name: macos
            exe_path: build/indigo
            binary_name: indigo
            package_name: ProtoIndigo-2.1.0-beta-macos-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure project
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build project
        run: cmake --build build --config Release

      - name: Create runtime package
        shell: bash
        run: |
          mkdir -p "package/${{ matrix.package_name }}"

          if [ -f "${{ matrix.exe_path }}" ]; then
            cp "${{ matrix.exe_path }}" "package/${{ matrix.package_name }}/${{ matrix.binary_name }}"
          elif [ -f "build/indigo.exe" ]; then
            cp build/indigo.exe "package/${{ matrix.package_name }}/${{ matrix.binary_name }}"
          elif [ -f "build/indigo" ]; then
            cp build/indigo "package/${{ matrix.package_name }}/${{ matrix.binary_name }}"
          else
            echo "Binary not found!"
            exit 1
          fi

          cp -r scripts "package/${{ matrix.package_name }}/scripts"
          cp LICENSE "package/${{ matrix.package_name }}/LICENSE"

      - name: Compress package
        shell: bash
        run: |
          cd package

          if [ "${{ matrix.name }}" = "windows" ]; then
            7z a "${{ matrix.package_name }}.zip" "${{ matrix.package_name }}"
          else
            tar -czf "${{ matrix.package_name }}.tar.gz" "${{ matrix.package_name }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: indigo-${{ matrix.name }}
          path: package/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ProtoIndigo 2.1.0-beta
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: true
          generate_release_notes: false
          fail_on_unmatched_files: true
          body: |
            # ProtoIndigo 2.1.0-beta
            **2026-10-17**

            > ⚠️ **Beta Release:** Unstable and incomplete build for testing.

            This update focuses entirely on innovation, restructuring, and adaptation. **BreVM is now an independent project.**

            ProtoIndigo continues to use BreVM's stack-based architecture, despite the hybrid architecture that also incorporates registers.

            This update introduces several **new features**, including support for **mathematical expressions**. It also brings minor **optimizations**, **error standardization**, and new **toolchains** to ensure the best possible experience.

            Enjoy the ProtoIndigo embedding releases! We are happy to announce the first prototype of the ProtoIndigo Standard Library.

            **Have a great October! 🎃**

            *(No functions for now...)*

            ---

            ## Fix

            - Fixed a CLI bug that caused `help.bre` to be searched for in an incorrect directory instead of the installation directory relative to the executable's location.
            - Added and fixed support for resolving the scripts directory across **Windows, Ubuntu, and macOS**.

            ## Changed

            ### C++ API

            - Replaced the `indigo` namespace with `bre`.
            - Added `Operation::inputFile()` for file input.
            - Introduced a new standard for creating `Operation` instances and using the API.

            > ProtoIndigo is now compiled as a library, while the CLI continues to be compiled as an executable.

            ```cpp
            #include <indigo.h>

            int main() {
                bre::Operation O;

                O.inputFile("FILE_PATH");
                O.executeString("new #Number x = 10");
            }
            ```

            > The `.pushSymbol()` method is planned for implementation in the stable release.

            ### CLI

            - Added the `repl` command to explicitly start the REPL.
            - Changed `--parse <file>` to return only an exit code (`0`) upon success.

            ### Parsing

            - Improved, cleaned up, and reorganized the parser.
            - Added parsing support for new expressions.

            ### Codegen

            - Added support for BreVM 0.0.2.
            - Added support for BreVMR 1.
            - Added support for new instructions and expressions.
            - Added support for `RuntimeValue` types.

            ---

            ## Standard Library

            The Standard Library is now available in its early testing and development stage.

            - `std_argv`: Returns the arguments passed through the CLI.

              ```bash
              indigo run main.bre hello!
              ```

              ```bre
              proto std_argv0 // indigo
              proto std_argv3 // hello!
              ```

            - `std_version`: Returns the ProtoIndigo version.

              ```bre
              proto std_version
              ```

            - `std_vm_version`: Returns the BreVM version.

              ```bre
              proto std_vm_version
              ```

            ## Keywords

            - Removed the `const` keyword.
            - Added the contextual keyword `label`.
            - Added the `go` keyword.
            - Added the `to` keyword.
            - Added the `pre` keyword.

            ## ProtoIndigo

            ### Comments

            Added support for comments.

            ```bre
            // Hello! This is a comment. The Tokenizer ignores it.
            ```

            ### Increment and decrement

            Added instructions for incrementing and decrementing `Number` variables and constants.

            ```bre
            new x = 10;
            x++; // Equivalent to: x = x + 1
            x--; // Equivalent to: x = x - 1
            ```

            > **Note:** Increment and decrement are currently instructions, not expressions. This limitation is expected to be addressed in future updates.

            ### Parenthesized expressions

            Added support for parenthesized expressions, which are evaluated with higher priority.

            `proto` remains an instruction, not a function. For example, `proto(10, "Hello World!")` results in an error.

            ```bre
            new x = 10 - 5 + (100 / 2);
            proto(10 / 2)
            ```

            ### Implicit multiplication

            This experimental feature allows numbers followed by identifiers or parenthesized expressions to be interpreted as multiplication.

            ```bre
            new x = 10;
            proto 2x; // Equivalent to: proto 2 * x;
            proto 2(10 + 10); // Equivalent to: proto 2 * (10 + 10);
            ```

            ### Labels

            Added the `label` instruction to mark locations in code for control-flow instructions such as `goto`.

            ```bre
            label myhome
            ```

            ### Constant declarations

            Removed the `const` declaration syntax.

            ```bre
            new const x = 5;
            ```

            The `now` keyword remains available for constant declarations.

            ```bre
            now x = 5;
            ```

            ### Pre-execution directives

            Added a new instruction for pre-execution directives.

            ```bre
            pre <statement>
            ```

            Script inclusion now uses `pre include`.

            ```bre
            pre include "file.bre"
            ```

            The `pre` keyword is required before `include` to specify script inclusion as a pre-execution directive.

            ---

            ## Downloads

            - **Windows x64:** `ProtoIndigo-2.1.0-beta-windows-x64.zip`
            - **Linux x64:** `ProtoIndigo-2.1.0-beta-linux-x64.tar.gz`
            - **macOS x64:** `ProtoIndigo-2.1.0-beta-macos-x64.tar.gz`

            Desktop packages include the ProtoIndigo executable, scripts directory, and LICENSE.

            **Note:** This is a beta release. Features and APIs may change before the stable release.
          files: |
            release-assets/indigo-linux/*
            release-assets/indigo-windows/*
            release-assets/indigo-macos/*

