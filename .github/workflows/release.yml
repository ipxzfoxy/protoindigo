name: Create Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            exe_path: build/indigo
            binary_name: indigo
            package_name: ProtoIndigo-2.0.1-linux-x64

          - os: windows-latest
            name: windows
            exe_path: build/Release/indigo.exe
            binary_name: indigo.exe
            package_name: ProtoIndigo-2.0.1-windows-x64

          - os: macos-latest
            name: macos
            exe_path: build/indigo
            binary_name: indigo
            package_name: ProtoIndigo-2.0.1-macos-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure project
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build project
        run: cmake --build build --config Release

      - name: Create runtime package
        shell: bash
        run: |
          mkdir -p package/${{ matrix.package_name }}

          if [ -f "${{ matrix.exe_path }}" ]; then
            cp "${{ matrix.exe_path }}" package/${{ matrix.package_name }}/${{ matrix.binary_name }}
          elif [ -f "build/indigo.exe" ]; then
            cp build/indigo.exe package/${{ matrix.package_name }}/${{ matrix.binary_name }}
          elif [ -f "build/indigo" ]; then
            cp build/indigo package/${{ matrix.package_name }}/${{ matrix.binary_name }}
          else
            echo "Binary not found!"
            exit 1
          fi

          cp -r scripts package/${{ matrix.package_name }}/scripts
          cp LICENSE package/${{ matrix.package_name }}/LICENSE

      - name: Compress package
        shell: bash
        run: |
          cd package

          if [ "${{ matrix.name }}" = "windows" ]; then
            7z a "${{ matrix.package_name }}.zip" "${{ matrix.package_name }}"
          else
            tar -czf "${{ matrix.package_name }}.tar.gz" "${{ matrix.package_name }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: indigo-${{ matrix.name }}
          path: |
            package/*.zip
            package/*.tar.gz

  build-wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Configure and Build WebAssembly
        run: |
          mkdir -p build-wasm
          cd build-wasm
          emcmake cmake .. -DCMAKE_BUILD_TYPE=Release
          emmake make

      - name: Package WebAssembly
        run: |
          mkdir -p package-wasm

          cp build-wasm/indigo.js package-wasm/ 2>/dev/null || true
          cp build-wasm/indigo.wasm package-wasm/ 2>/dev/null || true

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: indigo-wasm
          path: package-wasm/

  release:
    needs: [build, build-wasm]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ProtoIndigo 2.0.1

          body: |
            # ProtoIndigo 2.0.1

            This release focuses directly on improvements, bug fixes, and optimizations, providing a better overall experience.

            - REPL bug fixed: In the previous version, instructions entered in the REPL would always end with a syntax error.
            - VM and data flow optimizations.
            - New runtime structure: ProtoIndigo now uses its own directory structure containing files and resources required for full execution, no longer relying exclusively on the `indigo` executable.
            - Implementations using `.bre` files: Parts of ProtoIndigo, such as the `help` CLI command, are now implemented using Bre code.

            2.0.1: 2026-08-21

            ## Downloads

            Available builds:

            - Windows x64 (`ProtoIndigo-2.0.1-windows-x64.zip`)
            - Linux x64 (`ProtoIndigo-2.0.1-linux-x64.tar.gz`)
            - macOS x64 (`ProtoIndigo-2.0.1-macos-x64.tar.gz`)
            - WebAssembly (`indigo.wasm` / `indigo.js`)

            Desktop builds now include the complete ProtoIndigo runtime structure.

          files: |
            indigo-linux/*
            indigo-windows/*
            indigo-macos/*
            indigo-wasm/*